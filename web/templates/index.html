<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能眼病检测系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header-card card mt-4 mb-4">
            <div class="card-body text-center">
                <h1 class="card-title"><i class="bi bi-eye"></i> 智能眼底检测系统</h1>
                <div class="d-flex justify-content-center mt-4"> 
                    <!-- 移除批量检测按钮 -->
                    <button id="uploadBtn" class="btn btn-primary mx-2">
                        <i class="bi bi-upload"></i> 上传图片
                    </button>
                    <button id="startDetectionBtn" class="btn btn-success mx-2">
                        <i class="bi bi-search"></i> 开始检测
                    </button>
                </div>
                <input type="file" id="fileInput" style="display: none;" accept="image/*">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header">
                        <h5><i class="bi bi-image"></i> 影像预览</h5>
                    </div>
                    <div class="card-body text-center d-flex align-items-center justify-content-center">
                        <div id="imagePreview" class="d-flex justify-content-center align-items-center">
                            <img id="previewImage" src="" alt="预览图像" style="max-width: 100%; max-height: 300px; display: none;">
                            <div id="uploadPlaceholder" class="upload-placeholder">
                                <i class="bi bi-cloud-upload"></i>
                                <p>请上传眼底图像</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header">
                        <h5><i class="bi bi-graph-up"></i> 检测结果分析</h5>
                        <button id="downloadReport" class="btn btn-sm btn-outline-primary float-end" style="display: none;">
                            <i class="bi bi-download"></i> 下载报告
                        </button>
                    </div>
                    <div class="card-body d-flex align-items-center justify-content-center">
                        <div id="resultsContainer" style="display: none; width: 100%;">
                            <canvas id="resultsChart"></canvas>
                        </div>
                        <div id="noResultsMessage" class="text-center py-5">
                            <p class="text-muted">上传图像并点击"开始检测"查看结果</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 加载中提示 -->
        <div id="loadingOverlay" style="display: none;">
            <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p>正在处理图像，请稍候...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
